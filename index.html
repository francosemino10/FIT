<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#0f1115">
<title>FIT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root,[data-theme=oceano]{
  --bg:#0b1220;--card:#121c30;--card2:#18253f;--line:#24365a;--txt:#e6edf7;--mut:#8aa0bd;
  --acc:#2dd4bf;--ink:#05302b;--acc2:#60a5fa;--p:#fb7185;--c:#60a5fa;--f:#fbbf24;--bad:#f87171;--ok:#34d399;
  --hdr:rgba(11,18,32,.92);--warnbg:#2b2410;--warnln:#5a4a12;--warntx:#ffd166;--skin:#3b4f78;--plate:#e6edf7;
  --r:14px;color-scheme:dark;
}
[data-theme=terracota]{
  --bg:#faf6f1;--card:#ffffff;--card2:#f4ece2;--line:#e8ddcf;--txt:#3d405b;--mut:#8d8a9e;
  --acc:#e07a5f;--ink:#ffffff;--acc2:#81b29a;--p:#c8553d;--c:#5b8a72;--f:#d69e2e;--bad:#c0392b;--ok:#4f8a6c;
  --hdr:rgba(250,246,241,.92);--warnbg:#fdf1dc;--warnln:#f1d9a8;--warntx:#8a5a12;--skin:#e3d6c6;--plate:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:15px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;letter-spacing:.5px;font-size:18px}.brand b{color:var(--acc)}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{width:34px;height:34px;border-radius:10px;background:var(--card2);font-size:18px}
.datenav .dlabel{min-width:118px;white-space:nowrap;text-align:center;font-weight:600;font-size:13.5px;padding:6px 8px;border-radius:10px;background:var(--card2)}
.dlabel.today{color:var(--acc)}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.banner{max-width:640px;margin:10px auto 0;padding:0 14px}
.banner div{background:var(--warnbg);border:1px solid var(--warnln);color:var(--warntx);border-radius:12px;padding:10px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0;font-size:16px;font-weight:700}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:18px 2px 8px;font-weight:600}
.mut{color:var(--mut)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.btn{background:var(--acc);color:var(--ink);font-weight:700;border-radius:12px;padding:12px 14px;width:100%}
.btn.sec2{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.btn:disabled{opacity:.5}
.chip{padding:8px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.kcal-big{display:flex;align-items:baseline;gap:6px}
.kcal-big .n{font-size:34px;font-weight:800;letter-spacing:-1px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro .l{font-size:12px;color:var(--mut)}.macro .v{font-weight:700;font-size:15px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-h .k{font-weight:700}
.mline{font-size:12px;color:var(--mut);margin-top:2px}
.mline .p{color:var(--p)}.mline .c{color:var(--c)}.mline .f{color:var(--f)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{margin-top:10px}
.item .nm{font-weight:600;font-size:14.5px}
.add{display:block;width:100%;text-align:left;color:var(--acc);font-weight:700;padding:10px 0 0;font-size:14px}
.steps-n{font-size:28px;font-weight:800}
.ex{padding:12px;background:var(--card2);border-radius:12px;margin-top:10px}
.ex .nm{font-weight:700}
.sets{margin-top:8px;display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:6px;align-items:center}
.sets .hd{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.sets input{padding:9px 10px;text-align:center;background:var(--card)}
.sets .no{color:var(--mut);font-size:13px;text-align:center}
.x{width:34px;height:34px;border-radius:9px;color:var(--mut);font-size:18px}
.linkbtn{color:var(--acc);font-weight:600;font-size:13.5px;padding:8px 0}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--hdr);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;color:var(--mut);font-weight:600}
nav#tabs button svg{width:22px;height:22px}
nav#tabs button.on{color:var(--acc)}
.sheet-bg{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:calc(var(--vvh,100vh) - 24px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.sheet-h{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:17px;flex:1}
.sheet-b{padding:14px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
html.kb .sheet{height:calc(var(--vvh,100vh) - 8px);max-height:none;border-radius:16px 16px 0 0}
html.kb .sheet-b{padding-bottom:12px}
#foodq,#tplq{position:sticky;top:-14px;z-index:3;box-shadow:0 -14px 0 var(--card),0 6px 10px -6px rgba(0,0,0,.25)}
.hidden{display:none!important}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label.lb{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px;font-weight:600}
.frow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.frow:last-child{border-bottom:0}
.empty{color:var(--mut);text-align:center;padding:16px 8px;font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 0 0 1px var(--line)}
.chartbox{position:relative;height:230px;margin-top:12px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat div{background:var(--card2);border-radius:10px;padding:10px}
.stat .l{font-size:11.5px;color:var(--mut)}.stat .v{font-weight:800;font-size:17px;margin-top:2px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.tag{font-size:11px;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font-weight:700}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.fi{width:36px;height:36px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fi svg{width:26px;height:26px}
.mi{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi svg{width:36px;height:36px}
.bi{width:48px;height:48px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bi svg{width:42px;height:42px}
.ill{display:flex;justify-content:center;padding:8px 0 4px}.ill svg{width:120px;height:90px}
.thbtn{width:34px;height:34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--acc)}
.thbtn svg{width:18px;height:18px}
.brand{display:flex;align-items:center;gap:8px}
.timerbar{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;padding:0 12px 8px}
.timerbar-inner{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.timerbar.done .timerbar-inner{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.wstrip{display:flex;gap:5px;margin-bottom:12px}
.wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card2);color:var(--txt);border-radius:10px;padding:7px 2px;border:1px solid var(--line);transition:opacity .15s}
.wday.selected{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.wday.is-today{border:2px solid var(--acc)}
.wday.empty{opacity:.4}
.streak-badge{display:inline-flex;align-items:center;gap:3px;background:color-mix(in srgb,var(--f) 18%,transparent);color:var(--f);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid color-mix(in srgb,var(--f) 25%,transparent)}
</style>
</head>

</nav>

const writes={};

function applyDoc(id,b){
  if(id==='config'){S.config=b?{...clone(DEFAULT_CONFIG),...b}:clone(DEFAULT_CONFIG);return}
  if(id==='foods'){S.foods=b&&Array.isArray(b.items)?b.items:[];return}
  if(id==='meals'){S.meals=b&&Array.isArray(b.items)?b.items:[];return}
  if(id.startsWith('d-')){const d=id.slice(2);if(b)S.days[d]=b;else delete S.days[d];return}
  if(id.startsWith('w-')){if(b)S.workouts[id]=b;else delete S.workouts[id];return}
  if(id.startsWith('s-')){const d=id.slice(2);if(b&&b.steps!=null)S.health[d]=b.steps;else delete S.health[d];return}
  if(id.startsWith('b-')){const d=id.slice(2);if(b)S.body[d]=b;else delete S.body[d];return}
}
async function writeOnce(id,b){if(b===null)await S.col.doc(id).delete();else await S.col.doc(id).set(b)}
async function save(id,body){
  body=body===null?null:clone(body);
  applyDoc(id,body);
  if(S.mode==='local'){if(body===null)delete localStore[id];else localStore[id]=body;persistLocal();if(syncOn()){SYNC.pending[id]=true;syncSave();scheduleSync()}return}
  if(S.mode!=='db'){toast('Todav\u00EDa cargando, prob\u00E1 de nuevo');return}
  const w=writes[id]||(writes[id]={busy:false,has:false,next:null});
  w.next=body;w.has=true;if(w.busy)return;w.busy=true;
  while(w.has){const b=w.next;w.has=false;
    try{await writeOnce(id,b)}catch(e){
      if(e&&e.code==='unavailable'){await sleep(400+Math.random()*800);try{await writeOnce(id,b)}catch(e2){toast('No se pudo guardar, revis\u00E1 la conexi\u00F3n')}}
      else if(e&&e.code==='quota_exceeded')toast('Se llen\u00F3 el espacio de datos de la app');
      else toast('No se pudo guardar'+(e&&e.message?': '+e.message:''));
    }}
  w.busy=false;
}

function getSteps(d){const m=S.days[d]?.steps;return m!=null?m:(S.health[d]??null)}
function getDay(d){const x=S.days[d];const base={kind:'day',date:d,meals:{desayuno:[],almuerzo:[],merienda:[],cena:[]},steps:null};
  if(!x)return base;const c=clone(x);c.meals={...base.meals,...(c.meals||{})};return c}
function itemTot(it){const q=it.qty??1;return{kcal:(it.kcal||0)*q,p:(it.p||0)*q,c:(it.c||0)*q,f:(it.f||0)*q}}
function sumItems(list){return list.reduce((a,it)=>{const t=itemTot(it);a.kcal+=t.kcal;a.p+=t.p;a.c+=t.c;a.f+=t.f;return a},{kcal:0,p:0,c:0,f:0})}
function dayTot(day){return sumItems(MEALS.flatMap(([k])=>day.meals[k]||[]))}
function workoutsSorted(){return Object.values(S.workouts).filter(w=>w&&w.date).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function lastSetsFor(name,before){const ws=workoutsSorted().filter(w=>w.date<before).reverse();
  for(const w of ws){const e=(w.exercises||[]).find(e=>e.name===name);if(e&&e.sets&&e.sets.some(s=>s.w!=null||s.r!=null))return{date:w.date,sets:e.sets,range:e.range||''}}return null}
function routineById(id){return S.config.routines.find(r=>r.id===id)||S.config.routines[0]}

/* ---------- render ---------- */
function render(){
  S.charts.forEach(c=>c.destroy());S.charts=[];
  const dl=$('#dlabel');const isToday=S.date===iso(new Date());
  dl.textContent=isToday?'Hoy \u00B7 '+prettyDate(S.date):prettyDate(S.date);dl.classList.toggle('today',isToday);
  $('#datenav').classList.toggle('hidden',S.tab==='progreso'||S.tab==='ajustes');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=$('#view');
  if(S.mode==='loading'){v.innerHTML='<div class="empty"><span class="spin"></span> Cargando\u2026</div>';return}
  if(S.tab==='hoy')v.innerHTML=viewHoy();
  else if(S.tab==='entreno')v.innerHTML=viewEntreno();
  else if(S.tab==='progreso'){v.innerHTML=viewProgreso();drawCharts()}
  else if(S.tab==='cuerpo'){v.innerHTML=viewCuerpo();drawBodyChart()}
  else v.innerHTML=viewAjustes();
  renderSheet();renderTimer();
}

function macroLine(t){return `<span>${fmt(t.kcal)} kcal</span> \u00B7 <span class="p">P ${r0(t.p)}</span> \u00B7 <span class="c">C ${r0(t.c)}</span> \u00B7 <span class="f">G ${r0(t.f)}</span>`}
function pct(a,b){return b>0?Math.min(100,a/b*100):0}

function viewHoy(){
  const day=getDay(S.date),t=dayTot(day),g=S.config.goals;
  const rest=g.kcal-t.kcal;
  const streak=calcStreak();
  const isToday=S.date===iso(new Date());
  const m=(l,v,goal,col)=>`<div class="macro"><div class="l">${l}</div><div class="v">${r0(v)}<span class="mut small"> / ${r0(goal)} g</span></div><div class="bar"><i style="width:${pct(v,goal)}%;background:${col}"></i></div></div>`;
  let h=viewWeek();
  h+=`<div class="card">
    <div class="row"><div class="kcal-big"><span class="n">${fmt(t.kcal)}</span><span class="mut">/ ${fmt(g.kcal)} kcal</span></div><div class="sp"></div>
    ${isToday&&streak>0?`<div class="streak-badge">\u{1F525} ${streak} d\u00EDa${streak!==1?'s':''}</div>`:''}<div class="sp"></div>
    <div class="small ${rest<0?'':'mut'}" style="text-align:right;${rest<0?'color:var(--bad)':''}">${rest>=0?'Quedan':'Pasado'}<br><b style="font-size:15px">${fmt(Math.abs(rest))}</b></div></div>
    <div class="bar"><i style="width:${pct(t.kcal,g.kcal)}%;${rest<0?'background:var(--bad)':''}"></i></div>
    <div class="macros">${m('Prote\u00EDna',t.p,g.p,'var(--p)')}${m('Carbos',t.c,g.c,'var(--c)')}${m('Grasas',t.f,g.f,'var(--f)')}</div>
  </div>`;
  h+=`<div class="sec">Comidas</div>`;
  for(const [k,label] of MEALS){
    const list=day.meals[k]||[],mt=sumItems(list);
    h+=`<div class="card"><div class="row" style="gap:12px">${mealIcon(k)}<div class="sp"><div class="meal-h"><h3>${label}</h3><span class="k">${fmt(mt.kcal)} <span class="mut small">kcal</span></span></div>
      <div class="mline">${list.length?macroLine(mt):'Sin alimentos'}</div></div></div>`;
    list.forEach((it,i)=>{const tt=itemTot(it);
      h+=`<div class="item" data-act="edit-item" data-meal="${k}" data-i="${i}">${foodIcon(it.name)}<div class="sp"><div class="nm">${esc(it.name)}</div>
        <div class="mline">${qtyLabel(it)} \u00B7 <span class="p">P ${r0(tt.p)}</span> <span class="c">C ${r0(tt.c)}</span> <span class="f">G ${r0(tt.f)}</span></div></div>
        <div style="font-weight:600">${fmt(tt.kcal)}</div></div>`});
    h+=`<div class="row"><button class="add" data-act="open-add" data-meal="${k}">+ Agregar alimento</button>
      ${!list.length?`<button class="linkbtn" data-act="copy-day-open" data-meal="${k}" style="white-space:nowrap">\u{1F4CB} Copiar de otro d\u00EDa</button>`:`<button class="linkbtn" data-act="tpl-new" data-meal="${k}" style="white-space:nowrap">\u2606 Guardar comida</button>`}</div></div>`;
  }
  const st=getSteps(S.date),hs=S.health[S.date];
  h+=`<div class="sec">Pasos</div><div class="card"><div class="row"><div class="sp"><div class="steps-n">${st!=null?fmt(st):'\u2014'}</div>
    <div class="mut small">Objetivo ${fmt(g.steps)} pasos${hs!=null?` \u00B7 <span style="color:var(--acc2)">${day.steps!=null?`Salud: ${fmt(hs)} (us\u00E1s el manual)`:'sincronizado desde Salud'}</span>`:''}</div></div>
    <input id="stepsin" type="number" inputmode="numeric" placeholder="${hs!=null?fmt(hs):'Pasos'}" value="${day.steps??''}" style="width:130px;text-align:center"></div>
    <div class="bar"><i style="width:${pct(st||0,g.steps)}%;background:var(--acc2)"></i></div></div>`;
  return h;
}

function getDraft(){
  const key=S.date+'|'+S.routine;if(S.wdraft[key])return S.wdraft[key];
  const saved=S.workouts['w-'+S.date+'-'+S.routine];
  const r=routineById(S.routine);
  if(saved){const d={...clone(saved),dirty:false,saved:true};
    r.exercises.forEach(n=>{if(!d.exercises.some(e=>e.name===n)){const last=lastSetsFor(n,S.date);d.exercises.push({name:n,range:last?.range||rangeFor(n),sets:last?clone(last.sets):[]})}});
    d.exercises.forEach(e=>{if(!e.sets.length)e.sets=blankSets(e.name)});
    S.wdraft[key]=d;return d}
  const d={kind:'workout',date:S.date,routineId:r.id,routineName:r.name,dirty:false,saved:false,
    exercises:r.exercises.map(n=>{const last=lastSetsFor(n,S.date);return{name:n,range:last?.range||rangeFor(n),sets:last?last.sets.map(s=>({w:s.w,r:s.r})):blankSets(n)}})};
  S.wdraft[key]=d;return d;
}
function viewEntreno(){
  const rs=S.config.routines;
  let h=`<div class="chips">${rs.map(r=>{const done=!!S.workouts['w-'+S.date+'-'+r.id];return`<button class="chip ${r.id===S.routine?'on':''}" data-act="routine" data-id="${r.id}">${done?'\u2713 ':''}${esc(r.name)}</button>`}).join('')}</div>`;
  const r=routineById(S.routine),d=getDraft();
  if(!d.exercises.length){
    h+=`<div class="card" style="margin-top:12px">${emptyIll('pesa')}<div class="empty">\u00AB${esc(r.name)}\u00BB todav\u00EDa no tiene ejercicios.</div>
      <button class="btn" data-act="goto-routines">Cargar ejercicios de la rutina</button></div>`;return h}
  h+=`<div class="card" style="margin-top:12px"><div class="row"><h3 class="sp">${esc(r.name)}</h3>${d.saved?'<span class="tag">GUARDADO</span>':''}</div>
    <div class="mut small" style="margin-top:4px">Los pesos y reps vienen precargados de la \u00FAltima vez. Ajustalos y guard\u00E1.</div>`;
  d.exercises.forEach((e,ei)=>{
    const last=lastSetsFor(e.name,S.date);
    h+=`<div class="ex"><div class="row" style="gap:10px">${bodyIcon(e.name)}<div class="nm sp">${esc(e.name)}</div>
        <input data-rg="${ei}" value="${esc(e.range||'')}" placeholder="rango" inputmode="text" style="width:78px;padding:7px 8px;text-align:center;font-size:13px;background:var(--card)" aria-label="Rango de repeticiones"></div>
      ${last?`<div class="mut small" style="margin-top:2px">Anterior (${shortDate(last.date)}): ${last.sets.filter(s=>s.w!=null||s.r!=null).map(s=>`${s.w??'\u2013'}\u00D7${s.r??'\u2013'}`).join(', ')}${last.range?` \u00B7 rango ${esc(last.range)}`:''}</div>`:''}
      <div class="sets"><div class="hd">#</div><div class="hd">Peso (kg)</div><div class="hd">Reps</div><div></div>
      ${e.sets.map((s,si)=>`<div class="no">${si+1}</div>
        <input inputmode="decimal" data-w="${ei}|${si}|w" value="${s.w??''}" placeholder="kg">
        <input inputmode="numeric" data-w="${ei}|${si}|r" value="${s.r??''}" placeholder="reps">
        <button class="x" data-act="del-set" data-ei="${ei}" data-si="${si}" aria-label="Borrar serie">\u00D7</button>`).join('')}
      </div><button class="linkbtn" data-act="add-set" data-ei="${ei}">+ Serie</button>
      <div class="row" style="margin-top:8px;gap:6px"><span class="mut small">\u23F1</span>${[60,90,120,180].map(s=>{const lbl=s%60===0?`${s/60}min`:`${s}s`;return`<button class="chip${S.timerDur===s?' on':''}" data-act="timer-start" data-d="${s}" style="padding:5px 10px;font-size:12px">${lbl}</button>`}).join('')}</div></div>`});
  h+=`<div style="margin-top:14px"><button class="btn" data-act="save-workout">${d.saved?'Actualizar entrenamiento':'Guardar entrenamiento'}</button></div>
    ${d.saved?`<div style="margin-top:8px"><button class="btn danger" data-act="del-workout">Borrar registro de este d\u00EDa</button></div>`:''}</div>`;
  const hist=workoutsSorted().filter(w=>w.routineId===r.id).reverse().slice(0,5);
  if(hist.length){h+=`<div class="sec">\u00DAltimas sesiones \u00B7 ${esc(r.name)}</div><div class="card">${hist.map(w=>{const vol=(w.exercises||[]).reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.w||0)*(s.r||0),0),0);
    return `<div class="frow" data-act="goto-date" data-d="${w.date}"><div class="sp">${prettyDate(w.date)}</div><div class="mut small">${fmt(vol)} kg volumen</div></div>`}).join('')}</div>`}
  return h;
}

/* ---------- cuerpo ---------- */
const BODY=[['weight','Peso','kg'],['chest','Pecho','cm'],['waistHigh','Cintura alta','cm'],['belly','Panza','cm'],['waistLow','Cintura baja','cm'],['hip','Cadera','cm'],['arm','Brazo','cm']];
const BODY_Y={chest:12.5,waistHigh:16,belly:18.6,waistLow:21.2,hip:24,arm:13};
function bodySorted(){return Object.values(S.body).filter(b=>b&&b.date).sort((a,b)=>a.date<b.date?-1:1)}
function lastBodyVal(k,before){const l=bodySorted().filter(b=>b.date<before&&b[k]!=null);return l.length?l[l.length-1]:null}
function measureIll(k){const y=BODY_Y[k];const on='var(--acc)',off='var(--skin)';
  const tape=k==='arm'?`<path d="M4.4 ${y}h5" stroke="${cssv('--f')||'#fbbf24'}" stroke-width="1.6" stroke-dasharray="1.6 1" stroke-linecap="round"/>`:`<path d="M10 ${y}h12" stroke="${cssv('--f')||'#fbbf24'}" stroke-width="1.6" stroke-dasharray="1.6 1" stroke-linecap="round"/>`;
  return `<span class="bi" style="width:40px;height:40px">${SV(`<circle cx="16" cy="4.6" r="3" fill="${off}"/><path d="M10.5 8.4h11l-.8 7 .9 4.6-1 5H11.4l-1-5 .9-4.6z" fill="${off}"/><rect x="5.4" y="9.6" width="3" height="11" rx="1.5" fill="${off}"/><rect x="23.6" y="9.6" width="3" height="11" rx="1.5" fill="${off}"/><rect x="11.6" y="24.6" width="3.8" height="7" rx="1.6" fill="${off}"/><rect x="16.6" y="24.6" width="3.8" height="7" rx="1.6" fill="${off}"/>${tape}`)}</span>`}
function bodyFieldRow(k,l,u,dr){const last=lastBodyVal(k,S.date);
  return `<div class="row" style="margin-top:10px;gap:10px">${measureIll(k)}
    <div class="sp"><div style="font-weight:600">${l}</div><div class="mut small">${last?`\u00DAltimo: ${r1(last[k])} ${u} (${shortDate(last.date)})`:'Sin registros'}</div></div>
    <input data-body="${k}" inputmode="decimal" value="${dr[k]??''}" placeholder="${u}" style="width:96px;text-align:center"></div>`}
function bodyStats(pts,mu,goodDown){
  const last=pts[pts.length-1],first=pts[0],rg=regress(pts.slice(-10)),pw=rg?rg.b*7:0,proj=rg?rg.a+rg.b*(last.x+28):last.y;
  const c30=pts.find(p=>p.x>=last.x-30&&p!==last),d30=c30?last.y-c30.y:null;
  const col=v=>v==null||goodDown==null?'':`color:${v===0?'var(--txt)':((goodDown?v<0:v>0)?'var(--ok)':'var(--bad)')}`;
  const sg=v=>(v>=0?'+':'')+r1(v);
  return `<div class="stat"><div><div class="l">Actual</div><div class="v">${r1(last.y)}</div><div class="l">${mu}</div></div>
    <div><div class="l">Desde el inicio</div><div class="v" style="${col(last.y-first.y)}">${sg(last.y-first.y)}</div><div class="l">${mu} (${shortDate(first.d)})</div></div>
    <div><div class="l">\u00DAltimos 30 d\u00EDas</div><div class="v" style="${col(d30)}">${d30==null?'\u2014':sg(d30)}</div><div class="l">${mu}</div></div></div>
    <div class="mut small" style="margin-top:8px">Tendencia: ${sg(pw)} ${mu}/semana \u00B7 proyecci\u00F3n en 4 semanas: <b>${r1(proj)} ${mu}</b>.</div>`}
function viewCuerpo(){
  const saved=S.body[S.date]||{},dr=S.bodyDraft[S.date]||(S.bodyDraft[S.date]=clone(saved));
  const all=bodySorted();
  // ---- peso
  const lastW=lastBodyVal('weight',S.date);
  let h=`<div class="sec" style="margin-top:4px">Peso</div><div class="card">
    <div class="row" style="gap:12px"><span class="bi" style="width:44px;height:44px">${SV(`<rect x="5" y="7" width="22" height="20" rx="5" fill="var(--skin)"/><path d="M10.5 14a7.5 7.5 0 0 1 11 0" stroke="var(--acc)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M16 14l2.2-3" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/>`)}</span>
      <div class="sp"><div style="font-weight:600">Peso del d\u00EDa ${saved.weight!=null?'<span class="tag">GUARDADO</span>':''}</div><div class="mut small">${lastW?`\u00DAltimo: ${r1(lastW.weight)} kg (${shortDate(lastW.date)})`:'Sin registros'}</div></div>
      <input data-body="weight" inputmode="decimal" value="${dr.weight??''}" placeholder="kg" style="width:96px;text-align:center"></div>
    <div class="row" style="margin-top:12px;gap:8px"><button class="btn" data-act="body-save" data-g="w">${saved.weight!=null?'Actualizar peso':'Guardar peso'}</button>
      ${saved.weight!=null?`<button class="btn danger sm" data-act="body-del" data-g="w" style="padding:12px 14px">Borrar</button>`:''}</div>`;
  const wp=all.filter(b=>b.weight!=null).map(b=>({x:dayNum(b.date),y:b.weight,d:b.date}));
  h+=wp.length<2?`<div class="empty">Con 2 pesajes ya ves el gr\u00E1fico y la tendencia.</div>`:`<div class="chartbox"><canvas id="chWeight"></canvas></div>${bodyStats(wp,'kg',null)}`;
  h+=`</div>`;
  // ---- medidas
  const hasM=BODY.slice(1).some(([k])=>saved[k]!=null);
  h+=`<div class="sec">Medidas</div><div class="card"><div class="row"><h3 class="sp">Medidas del d\u00EDa</h3>${hasM?'<span class="tag">GUARDADO</span>':''}</div>
    <div class="mut small" style="margin-top:4px">Carg\u00E1 solo las que mediste. Con una vez por semana alcanza.</div>
    ${BODY.slice(1).map(([k,l,u])=>bodyFieldRow(k,l,u,dr)).join('')}
    <div class="row" style="margin-top:14px;gap:8px"><button class="btn" data-act="body-save" data-g="m">${hasM?'Actualizar medidas':'Guardar medidas'}</button>
      ${hasM?`<button class="btn danger sm" data-act="body-del" data-g="m" style="padding:12px 14px">Borrar</button>`:''}</div></div>`;
  h+=`<div class="card"><div class="chips">${BODY.slice(1).map(([k,l])=>`<button class="chip ${S.bodyMetric===k?'on':''}" data-act="body-metric" data-k="${k}">${l}</button>`).join('')}</div>`;
  const [mk,ml,mu]=BODY.find(b=>b[0]===S.bodyMetric),pts=all.filter(b=>b[mk]!=null).map(b=>({x:dayNum(b.date),y:b[mk],d:b.date}));
  h+=pts.length<2?emptyIll('grafico')+`<div class="empty">Con 2 registros de ${ml.toLowerCase()} ya ves el gr\u00E1fico y la tendencia${pts.length?` (hay 1)`:''}.</div>`
    :`<div class="chartbox"><canvas id="chBody"></canvas></div>${bodyStats(pts,mu,!['chest','arm'].includes(mk))}`;
  h+=`</div>`;
  const meas=BODY.slice(1).map(([k,l,u])=>{const p=all.filter(b=>b[k]!=null);return p.length?{l,u,first:p[0],last:p[p.length-1],k}:null}).filter(Boolean);
  if(meas.length){h+=`<div class="sec">Resumen de medidas</div><div class="card">${meas.map(m=>{const d=m.last[m.k]-m.first[m.k];
    return`<div class="frow" style="cursor:default"><div class="sp" style="font-weight:600">${m.l}</div><div class="mut small" style="margin-right:10px">${r1(m.first[m.k])} \u2192 </div><div style="font-weight:700;min-width:58px;text-align:right">${r1(m.last[m.k])} cm</div><div class="small" style="min-width:52px;text-align:right;color:${d===0?'var(--mut)':(['chest','arm'].includes(m.k)?(d>0?'var(--ok)':'var(--bad)'):(d<0?'var(--ok)':'var(--bad)'))}">${d>=0?'+':''}${r1(d)}</div></div>`}).join('')}
    <div class="mut small" style="margin-top:6px">Verde = va en la direcci\u00F3n buena para recomposici\u00F3n (bajar cintura/panza/cadera, subir pecho/brazo).</div></div>`}
  if(all.length){h+=`<div class="sec">Historial</div><div class="card" style="padding:0">`+all.slice().reverse().map(b=>{const vals=BODY.filter(([k])=>b[k]!=null).map(([k,l,u])=>`${l}: <b>${r1(b[k])}</b>\u00A0${u}`).join(' \u00B7 ');return`<div style="padding:10px 14px;border-bottom:1px solid var(--line)"><div style="font-weight:600">${prettyDate(b.date)}</div><div class="mut small" style="margin-top:3px">${vals}</div></div>`}).join('')+`</div>`}
  h+=`<button class="btn sec2" data-act="import-open" style="margin-top:4px">Importar registros anteriores</button>`;
  return h;
}
function lineChart(canvas,pts,label){chartBase();
  const A=cssv('--acc'),A2=cssv('--acc2'),rg=regress(pts.slice(-10)),lastX=pts[pts.length-1].x,x0=pts.slice(-10)[0].x;
  const ds=[{type:'line',label,data:pts.map(p=>({x:p.x,y:p.y})),borderColor:A,backgroundColor:A,tension:.25,pointRadius:pts.length>40?0:3.5}];
  if(rg)ds.push({type:'line',label:'Proyecci\u00F3n',data:[{x:x0,y:rg.a+rg.b*x0},{x:lastX,y:rg.a+rg.b*lastX},{x:lastX+28,y:rg.a+rg.b*(lastX+28)}],borderColor:A2,borderDash:[6,5],pointRadius:[0,0,4],pointBackgroundColor:A2,borderWidth:2});
  const fd=v=>{const d=new Date(v*864e5);return `${d.getUTCDate()}/${d.getUTCMonth()+1}`};
  S.charts.push(new Chart(canvas,{data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{boxWidth:12}},tooltip:{callbacks:{title:it=>fd(it[0].parsed.x)}}},
    scales:{x:{type:'linear',ticks:{callback:fd,maxTicksLimit:6}},y:{grace:'10%'}}}}))}
function drawBodyChart(){if(!window.Chart)return;const all=bodySorted();
  const cw=$('#chWeight');if(cw)lineChart(cw,all.filter(b=>b.weight!=null).map(b=>({x:dayNum(b.date),y:b.weight})),'Peso (kg)');
  const cb=$('#chBody');if(cb){const [mk,ml]=BODY.find(b=>b[0]===S.bodyMetric);lineChart(cb,all.filter(b=>b[mk]!=null).map(b=>({x:dayNum(b.date),y:b[mk]})),ml+' (cm)')}}

/* ---------- respaldo ---------- */
function backupData(){return{app:'FIT',config:S.config,foods:S.foods,meals:S.meals,body:S.body,days:S.days,workouts:S.workouts,exported:new Date().toISOString()}}
async function restoreBackup(d){
  if(d.config)await save('config',d.config);
  if(Array.isArray(d.foods)){const m=new Map(S.foods.map(f=>[f.id,f]));d.foods.forEach(f=>m.set(f.id,f));await save('foods',{items:[...m.values()]})}
  if(Array.isArray(d.meals)){const m=new Map(S.meals.map(f=>[f.id,f]));d.meals.forEach(f=>m.set(f.id,f));await save('meals',{items:[...m.values()]})}
  for(const [k,v] of Object.entries(d.days||{}))await save('d-'+k,v);
  for(const [k,v] of Object.entries(d.workouts||{}))await save(k.startsWith('w-')?k:'w-'+k,v);
  for(const [k,v] of Object.entries(d.body||{}))await save('b-'+k,v);
}
/* ---------- importar entrenamientos ---------- */
function routineFromText(t){t=norm(String(t||'').trim());const rs=S.config.routines;
  const m=t.match(/^(?:dia\s*)?(\d)\b/);if(m&&rs[+m[1]-1])return rs[+m[1]-1];
  return rs.find(r=>norm(r.name).includes(t)||t.includes(norm(r.name)))||null}
function parseWorkoutImport(txt){const rows=[],bad=[];const keys=new Set();
  txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    if(/^fecha/i.test(line))return;const p=line.split(/[;\t|]/).map(x=>x.trim());
    const d=parseDate(p[0]||''),r=routineFromText(p[1]),name=p[2];
    if(!d||!r||!name){bad.push(line);return}
    const sets=(p[3]||'').split(/,/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.replace(/kg/ig,'').match(/^(\d+(?:[.,]\d+)?)?\s*[x\u00D7*]\s*(\d+)?$/i);return m?{w:num(m[1]),r:m[2]?+m[2]:null}:null});
    if(!sets.length||sets.some(s=>!s)){bad.push(line);return}
    rows.push({date:d,rid:r.id,rname:r.name,name,sets,range:p[4]||''});keys.add(d+'|'+r.id)});
  return{rows,bad,sessions:keys.size}}
async function applyWorkoutImport(rows){const by={};rows.forEach(x=>{(by['w-'+x.date+'-'+x.rid]||(by['w-'+x.date+'-'+x.rid]={date:x.date,rid:x.rid,rname:x.rname,ex:[]})).ex.push(x)});
  for(const [id,g] of Object.entries(by)){const cur=S.workouts[id]?clone(S.workouts[id]):{kind:'workout',date:g.date,routineId:g.rid,routineName:g.rname,exercises:[]};
    g.ex.forEach(x=>{const e={name:x.name,range:x.range,sets:x.sets};const i=cur.exercises.findIndex(y=>y.name===x.name);if(i>=0)cur.exercises[i]=e;else cur.exercises.push(e)});
    const order=(routineById(g.rid).exercises||[]);cur.exercises.sort((a,b)=>{const ia=order.indexOf(a.name),ib=order.indexOf(b.name);return (ia<0?99:ia)-(ib<0?99:ib)});
    await save(id,cur)}
  return Object.keys(by).length}
/* ---------- importar comidas ---------- */
function mealFromText(t){t=norm(t);const m=MEALS.find(([k,l])=>norm(l)===t||k===t||norm(l).startsWith(t));return m?m[0]:null}
function findFoodOrMeal(name){const n=norm(name).trim();
  let f=allFoods().find(x=>norm(x.name)===n);if(f)return{food:f};
  let m=allMeals().find(x=>norm(x.name)===n);if(m)return{meal:m};
  const fs=allFoods().filter(x=>norm(x.name).includes(n));if(fs.length===1)return{food:fs[0]};
  const ms=allMeals().filter(x=>norm(x.name).includes(n));if(ms.length===1)return{meal:ms[0]};return null}
function parseMealImport(txt){const rows=[],bad=[];
  txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    if(/^fecha/i.test(line))return;const p=line.split(/[;\t|]/).map(x=>x.trim());
    const d=parseDate(p[0]||''),meal=mealFromText(p[1]||''),hit=p[2]?findFoodOrMeal(p[2]):null;
    if(!d||!meal||!hit){bad.push(line);return}
    const qm=String(p[3]||'1').replace(/\s/g,'').match(/^(\d+(?:[.,]\d+)?)(g|ml)?$/i);if(!qm){bad.push(line);return}
    const v=num(qm[1]);let items;
    if(hit.food){let q=v;if(qm[2]){const b=portionBase(hit.food.portion);if(!b){bad.push(line);return}q=v/b.amt}
      items=[mealItemFrom(hit.food,Math.round(q*1000)/1000)]}
    else{if(qm[2]){bad.push(line);return}items=hit.meal.items.map(it=>({...clone(it),qty:Math.round((it.qty??1)*v*1000)/1000}))}
    rows.push({date:d,meal,label:(hit.food||hit.meal).name,amt:p[3]||'1',items})});
  return{rows,bad,days:new Set(rows.map(r=>r.date)).size}}
async function applyMealImport(rows){const by={};rows.forEach(r=>{(by[r.date]||(by[r.date]=[])).push(r)});
  for(const [d,rs] of Object.entries(by)){const day=getDay(d);new Set(rs.map(r=>r.meal)).forEach(m=>day.meals[m]=[]);rs.forEach(r=>r.items.forEach(it=>day.meals[r.meal].push(it)));await save('d-'+d,day)}
  return Object.keys(by).length}
/* ---------- importar ---------- */
function parseDate(s){s=s.trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);if(!m)return null;
  let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;const d=`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if(!m[3]&&d>iso(new Date()))return `${y-1}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return isNaN(Date.parse(d))?null:d}
function parseImport(txt){const keys=BODY.map(b=>b[0]),rows=[],bad=[];
  txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((line,i)=>{
    if(/^fecha/i.test(line))return;
    const parts=line.split(/[;\t|]/).map(x=>x.trim());
    const d=parseDate(parts[0]||'');if(!d){bad.push(line);return}
    const r={date:d};keys.forEach((k,j)=>{const v=num(parts[j+1]);if(v!=null&&v>0)r[k]=v});
    if(Object.keys(r).length>1)rows.push(r);else bad.push(line)});
  return{rows,bad}}

/* ---------- progreso ---------- *//* ---------- progreso ---------- */
function allExercises(){const set=new Set();workoutsSorted().forEach(w=>(w.exercises||[]).forEach(e=>{if(e.sets.some(s=>s.w!=null&&s.r))set.add(e.name)}));
  S.config.routines.forEach(r=>r.exercises.forEach(n=>set.add(n)));return[...set]}
function metricOf(e,m){const ss=e.sets.filter(s=>s.w!=null&&s.r);if(!ss.length)return null;
  if(m==='max')return Math.max(...ss.map(s=>s.w));
  if(m==='1rm')return r1(Math.max(...ss.map(s=>s.w*(1+s.r/30))));
  return ss.reduce((a,s)=>a+s.w*s.r,0)}
function regress(pts){const n=pts.length;if(n<2)return null;const mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;
  let num_=0,den=0;pts.forEach(p=>{num_+=(p.x-mx)*(p.y-my);den+=(p.x-mx)**2});if(!den)return null;const b=num_/den;return{b,a:my-b*mx}}
function exSeries(name,m){const pts=[];workoutsSorted().forEach(w=>{const e=(w.exercises||[]).find(e=>e.name===name);if(!e)return;const v=metricOf(e,m);if(v!=null)pts.push({x:dayNum(w.date),y:v,d:w.date})});return pts}

  :'<div class="empty">Sin resultados.</div>'}

/* ---------- sheets (modals) ---------- */

      else if(s.tab==='tpl'){body+=allMeals().length?`<input id="tplq" placeholder="Buscar comida (ej: pollo, tostadas)\u2026" value="${esc(s.tq||'')}" style="margin-top:12px"><div id="tpllist" style="margin-top:4px">${tplRows(s.tq)}</div>`
          :emptyIll('comidas')+'<div class="empty">Todav\u00EDa no guardaste comidas. Carg\u00E1 una comida con todos sus alimentos y toc\u00E1 \u00AB\u2606 Guardar comida\u00BB en esa tarjeta.</div>'}
      else if(s.tab==='man'){const m=s.man||{};body+=foodForm(m)+`<label class="row" style="margin-top:12px;gap:10px"><input type="checkbox" id="mansave" checked style="width:20px"> <span class="small">Guardar tambi\u00E9n en Mis alimentos</span></label>
        <div style="margin-top:12px"><button class="btn" data-act="add-manual">Agregar</button></div>`}
      else{const a=s.ai||{};
        body+=`<div class="mut small" style="margin-top:12px">Describ\u00ED lo que comiste${S.sampleImages?' o sub\u00ED una captura de tu diario de MyFitnessPal / una etiqueta nutricional':''}. Claude calcula los macros y vos revis\u00E1s antes de agregar.</div>
        <textarea id="aitext" rows="3" style="margin-top:10px" placeholder="Ej: 2 huevos revueltos, 1 tostada integral con palta, caf\u00E9 con leche">${esc(a.text||'')}</textarea>
        ${S.sampleImages?`<label class="lb">Imagen (opcional)</label><input type="file" id="aiimg" accept="image/*">${a.imgName?`<div class="mut small" style="margin-top:4px">\u{1F4CE} ${esc(a.imgName)}</div>`:''}`:''}
        <div style="margin-top:12px"><button class="btn" data-act="ai-run" ${a.busy?'disabled':''}>${a.busy?'<span class="spin"></span> Analizando\u2026':'Calcular macros'}</button></div>
        ${a.err?`<div class="small" style="color:var(--bad);margin-top:8px">${esc(a.err)}</div>`:''}
        ${a.items?`<div style="margin-top:14px">${a.items.map((it,i)=>`<label class="frow" style="cursor:pointer"><input type="checkbox" data-aisel="${i}" ${it.sel?'checked':''}>${foodIcon(it.name)}
          <div class="sp"><div style="font-weight:600">${esc(it.name)}</div><div class="mline">${esc(it.portion)} \u00B7 ${fmt(it.kcal)} kcal \u00B7 <span class="p">P ${r1(it.p)}</span> <span class="c">C ${r1(it.c)}</span> <span class="f">G ${r1(it.f)}</span></div></div></label>`).join('')}
          <label class="row" style="margin-top:10px;gap:10px"><input type="checkbox" id="aisave" checked> <span class="small">Guardar tambi\u00E9n en Mis alimentos</span></label>

    }
  }
  else if(s.type==='item'){const it=s.item;title=it.name;
    body=`<div class="mut small">${esc(it.portion||'porci\u00F3n')}: ${fmt(it.kcal)} kcal \u00B7 P ${r1(it.p)} \u00B7 C ${r1(it.c)} \u00B7 G ${r1(it.f)}</div>

  else if(s.type==='tpl'){const t=s.tpl;title=t.id&&(S.meals.some(m=>m.id===t.id)||t.baseId)?'Editar comida guardada':'Guardar comida';
    body=`<label class="lb" style="margin-top:0">Nombre</label><input id="tplname" value="${esc(t.name)}" placeholder="Ej: Yogur con granola">

      ${t.items.map((it,i)=>{const tt=itemTot(it);return`<div class="frow" style="cursor:default">${foodIcon(it.name)}<div class="sp"><div style="font-weight:600">${esc(it.name)}</div><div class="mline">${qtyLabel(it)} \u00B7 ${fmt(tt.kcal)} kcal</div></div><button class="x" data-act="tpl-rm" data-i="${i}" aria-label="Quitar">\u00D7</button></div>`}).join('')}
      <div class="card" style="margin-top:10px;background:var(--card2)"><div class="mline" style="font-size:14px">Total: ${macroLine(sumItems(t.items))}</div></div>
      <button class="btn" data-act="tpl-save">Guardar</button>
      ${S.meals.some(m=>m.id===t.id)||t.baseId?`<div style="margin-top:8px"><button class="btn danger" data-act="tpl-del">Eliminar comida guardada</button></div>`:''}`}
  else if(s.type==='synckeys'){title='Datos para el atajo de pasos';
    const ep=SB.url.replace(/\/$/,'')+'/rest/v1/rpc/fit_steps';
    const fld=(l,v,k)=>`<label class="lb">${l}</label><div class="row"><input readonly value="${esc(v)}" style="font-family:monospace;font-size:12px"><button class="btn sec2 sm" data-act="copy-val" data-k="${k}">Copiar</button></div>`;
    body=`<div class="mut small">Copi\u00E1 cada valor en el atajo de Atajos tal como te indica Claude. La <b>clave secreta</b> es como una contrase\u00F1a: no la compartas.</div>
      ${fld('URL (Obtener contenido de URL)',ep,'url')}${fld('Encabezado apikey',SB.key,'key')}${fld('Clave secreta (p_secret)',SYNC.secret,'secret')}`}
  else if(s.type==='syncsecret'){title='Pegar clave existente';
    body=`<div class="mut small">Si ya activaste la sincronizaci\u00F3n en otro celular, peg\u00E1 ac\u00E1 la clave secreta de ese celular (Ajustes \u2192 Datos para el atajo de pasos).</div>
      <input id="secin" style="margin-top:10px;font-family:monospace" placeholder="clave secreta">
      ${s.err?`<div class="small" style="color:var(--bad);margin-top:8px">${esc(s.err)}</div>`:''}
      <div style="margin-top:12px"><button class="btn" data-act="sync-use">Conectar</button></div>`}
  else if(s.type==='wimport'){title='Importar entrenamientos';const r=s.res;
    body=`<div class="mut small">Una l\u00EDnea por ejercicio:<br><b>fecha; d\u00EDa; ejercicio; series; rango</b><br>Series como <b>peso x reps</b> separadas por coma. Ej:<br><code>06/10/2026; 1; Press inclinado en Smith; 40x10, 45x8, 45x8; 8-10</code></div>
      <textarea id="wimptxt" rows="8" style="margin-top:10px;font-family:monospace;font-size:12px">${esc(s.txt||'')}</textarea>
      <div style="margin-top:10px"><button class="btn sec2" data-act="wimport-check">Revisar</button></div>
      ${r?`<div class="card" style="margin-top:12px;background:var(--card2)"><b>${r.sessions}</b> sesiones \u00B7 <b>${r.rows.length}</b> ejercicios${r.bad.length?` \u00B7 <span style="color:var(--bad)">${r.bad.length} ${r.bad.length===1?'l\u00EDnea':'l\u00EDneas'} con error</span>`:''}
        ${r.bad.slice(0,4).map(l=>`<div class="mline" style="color:var(--bad)">\u2717 ${esc(l)}</div>`).join('')}</div>
        ${r.rows.length?`<button class="btn" data-act="wimport-go">Importar</button><div class="mut small" style="margin-top:6px">Si un d\u00EDa ya ten\u00EDa ese ejercicio, se reemplaza.</div>`:''}`:''}`}
  else if(s.type==='mimport'){title='Importar comidas';const r=s.res;
    body=`<div class="mut small">Una línea por alimento o comida guardada:<br><b>fecha; comida; alimento; cantidad</b><br>Cantidad en unidades/porciones (<b>2</b>) o en gramos (<b>60g</b>). Ej:<br><code>21/11/2026; desayuno; Huevo entero; 2</code></div>
      <textarea id="mimptxt" rows="8" style="margin-top:10px;font-family:monospace;font-size:12px">${esc(s.txt||'')}</textarea>
      <div style="margin-top:10px"><button class="btn sec2" data-act="mimport-check">Revisar</button></div>
      ${r?`<div class="card" style="margin-top:12px;background:var(--card2)"><b>${r.days}</b> días · <b>${r.rows.length}</b> líneas${r.bad.length?` · <span style="color:var(--bad)">${r.bad.length} con error</span>`:''}
        ${r.rows.map(x=>`<div class="mline" style="margin-top:4px">${prettyDate(x.date)} · ${MEALS.find(m=>m[0]===x.meal)[1]}: ${esc(x.label)} × ${esc(x.amt)} · ${Math.round(x.items.reduce((a,it)=>a+itemTot(it).kcal,0))} kcal</div>`).join('')}
        ${r.bad.map(l=>`<div class="mline" style="color:var(--bad)">✗ ${esc(l)}</div>`).join('')}</div>
        ${r.rows.length&&!r.bad.length?`<button class="btn" data-act="mimport-go">Importar</button><div class="mut small" style="margin-top:6px">Las comidas del bloque reemplazan lo que ya había en ese día y comida (las demás no se tocan).</div>`:''}`:''}`}
  else if(s.type==='restore'){title='Restaurar respaldo';
    body=`<div class="mut small">Peg\u00E1 el respaldo copiado${IS_PWA?' o eleg\u00ED el archivo descargado':''}. Se suma a lo que ya ten\u00E9s (los d\u00EDas repetidos se reemplazan).</div>
      ${IS_PWA?`<label class="lb">Archivo</label><input type="file" id="rstfile" accept=".json,application/json,text/plain">`:''}
      <label class="lb">Texto del respaldo</label><textarea id="rsttxt" rows="6" style="font-family:monospace;font-size:12px">${esc(s.txt||'')}</textarea>
      ${s.err?`<div class="small" style="color:var(--bad);margin-top:8px">${esc(s.err)}</div>`:''}
      <div style="margin-top:12px"><button class="btn" data-act="restore-go">Restaurar</button></div>`}
  else if(s.type==='import'){title='Importar peso y medidas';const r=s.res;
    body=`<div class="mut small">Una l\u00EDnea por d\u00EDa, separando con punto y coma:<br><b>fecha; peso; pecho; cintura alta; panza; cintura baja; cadera; brazo</b><br>Dej\u00E1 vac\u00EDo lo que no tengas. Ej:<br><code>04/11/2026; 84.2; 104; 90; 94; 92; 102; 36</code><br><code>08/11/2026; 83.8</code></div>
      <textarea id="imptxt" rows="8" style="margin-top:10px;font-family:monospace;font-size:13px" placeholder="dd/mm/aaaa; peso; pecho; ...">${esc(s.txt||'')}</textarea>
      <div style="margin-top:10px"><button class="btn sec2" data-act="import-check">Revisar</button></div>
      ${r?`<div class="card" style="margin-top:12px;background:var(--card2)"><b>${r.rows.length}</b> registros listos${r.bad.length?` \u00B7 <span style="color:var(--bad)">${r.bad.length} ${r.bad.length===1?'l\u00EDnea no se entendi\u00F3':'l\u00EDneas no se entendieron'}</span>`:''}
        ${r.rows.slice(0,8).map(x=>`<div class="mline" style="margin-top:4px">${prettyDate(x.date)}: ${BODY.filter(([k])=>x[k]!=null).map(([k,l,u])=>`${l} ${x[k]}`).join(' \u00B7 ')}</div>`).join('')}${r.rows.length>8?`<div class="mline">\u2026 y ${r.rows.length-8} m\u00E1s</div>`:''}
        ${r.bad.slice(0,3).map(l=>`<div class="mline" style="color:var(--bad)">\u2717 ${esc(l)}</div>`).join('')}</div>
        ${r.rows.length?`<button class="btn" data-act="import-go">Importar ${r.rows.length} registros</button><div class="mut small" style="margin-top:6px">Si un d\u00EDa ya ten\u00EDa datos, se combinan (los valores importados reemplazan a los anteriores).</div>`:''}`:''}`}
  else if(s.type==='copyDay'){title='Copiar de otro d\u00EDa';
    const ml=MEALS.find(m=>m[0]===s.meal)[1];const today=iso(new Date());
    const days=[];for(let i=1;i<=30&&days.length<10;i++){const d=addDays(today,-i);const items=(S.days[d]?.meals?.[s.meal]||[]);if(items.length)days.push({d,items})}
    if(!days.length)body=`<div class="empty">No hay d\u00EDas anteriores con datos en ${esc(ml)}.</div>`;
    else body=days.map(({d,items})=>`<div class="frow" data-act="copy-day-use" data-meal="${s.meal}" data-d="${d}" style="cursor:pointer">
      <div class="sp"><div style="font-weight:600">${prettyDate(d)}</div>
      <div class="mline">${items.slice(0,3).map(it=>esc(it.name)).join(' \u00B7 ')}${items.length>3?` \u00B7 +${items.length-3} m\u00E1s`:''} \u00B7 ${fmt(r0(sumItems(items).kcal))} kcal</div></div>
      <span style="color:var(--acc);font-size:22px">\u203A</span></div>`).join('')}
  else if(s.type==='food'){title=s.food.id?'Editar alimento':'Nuevo alimento';
    body=foodForm(s.food)+`<div style="margin-top:14px"><button class="btn" data-act="food-save">Guardar</button></div>
      ${s.food.id?`<div style="margin-top:8px"><button class="btn danger" data-act="food-del">Eliminar</button></div>`:''}`}
  root.innerHTML=`<div class="sheet-bg" data-act="sheet-bg"><div class="sheet"><div class="sheet-h"><h3>${esc(title)}</h3><button class="x" data-act="close" aria-label="Cerrar">\u00D7</button></div><div class="sheet-b">${body}</div></div></div>`;
}
function foodForm(f){return `<label class="lb">Nombre</label><input id="ff-name" value="${esc(f.name||'')}" placeholder="Ej: Pechuga de pollo">
  <label class="lb">Porci\u00F3n</label><input id="ff-portion" value="${esc(f.portion||'')}" placeholder="Ej: 100 g, 1 unidad, 1 taza">
  <div class="f4"><div><label class="lb">Kcal</label><input id="ff-kcal" inputmode="decimal" value="${f.kcal??''}"></div>
  <div><label class="lb">Prot.</label><input id="ff-p" inputmode="decimal" value="${f.p??''}"></div>
  <div><label class="lb">Carb.</label><input id="ff-c" inputmode="decimal" value="${f.c??''}"></div>
  <div><label class="lb">Grasa</label><input id="ff-f" inputmode="decimal" value="${f.f??''}"></div></div>
  <div class="mut small" style="margin-top:6px">Copi\u00E1 los valores de MyFitnessPal para esa porci\u00F3n. Si dej\u00E1s kcal vac\u00EDo, se calcula con los macros.</div>`}
function readFoodForm(){const g=id=>$('#ff-'+id)?.value;const p=num(g('p'))||0,c=num(g('c'))||0,f=num(g('f'))||0;let k=num(g('kcal'));if(k==null)k=r0(p*4+c*4+f*9);
  return{name:(g('name')||'').trim(),portion:(g('portion')||'').trim()||'porci\u00F3n',kcal:k,p,c,f}}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* ---------- racha + semana + timer ---------- */
function calcStreak(){let d=iso(new Date()),n=0;for(;;){const dy=S.days[d];if(!dy||!MEALS.some(([k])=>(dy.meals?.[k]||[]).length))break;n++;d=addDays(d,-1)}return n}
function viewWeek(){
  const today=iso(new Date());
  const dw=new Date(S.date+'T12:00:00').getDay();
  const mon=addDays(S.date,-(dw===0?6:dw-1));
  const ds=[...Array(7)].map((_,i)=>addDays(mon,i));
  const g=S.config.goals;const LL=['L','M','X','J','V','S','D'];
  return'<div class="wstrip">'+ds.map((d,i)=>{
    const isT=d===S.date,isTd=d===today,isFut=d>today;
    const hasData=!isFut&&!!S.days[d]&&MEALS.some(([k])=>(S.days[d]?.meals?.[k]||[]).length);
    const kt=hasData?r0(dayTot(getDay(d)).kcal):0;
    const pc=hasData&&g.kcal>0?Math.min(100,kt/g.kcal*100):0;
    const cls=(isTd&&!isT?' is-today':'')+(isT?' selected':'')+((!hasData&&!isFut&&!isT)?' empty':'');
    return`<button data-act="goto-date" data-d="${d}" class="wday${cls}">
      <span style="font-size:11px;font-weight:700">${LL[i]}</span>
      <span style="font-size:9px;line-height:1">${isFut?'':hasData?fmt(kt):'\u2014'}</span>
      <div style="width:22px;height:3px;border-radius:99px;background:${isT?'rgba(0,0,0,.2)':'var(--line)'}"><div style="width:${pc}%;height:100%;border-radius:99px;background:${isT?'var(--ink)':'var(--acc)'}"></div></div>
    </button>`}).join('')+'</div>'}
function timerTick(){
  S.timer.left--;renderTimer();
  if(S.timer.left>0)return;
  S.timer.running=false;clearInterval(S.timer.t);
  try{navigator.vibrate&&navigator.vibrate([200,100,200,100,200])}catch(e){}
  try{const ctx=new AudioContext();const o=ctx.createOscillator();const gn=ctx.createGain();o.connect(gn);gn.connect(ctx.destination);o.frequency.value=880;gn.gain.setValueAtTime(0.4,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);o.start();o.stop(ctx.currentTime+0.5);setTimeout(()=>ctx.close(),700)}catch(e){}}
function timerStart(secs){clearInterval(S.timer.t);S.timer.total=secs;S.timer.left=secs;S.timer.running=true;S.timer.t=setInterval(timerTick,1000);renderTimer()}
function timerResume(){if(!S.timer.running&&S.timer.left>0){S.timer.running=true;S.timer.t=setInterval(timerTick,1000);renderTimer()}}
function renderTimer(){
  let el=document.getElementById('timerbar');
  if(!el){el=document.createElement('div');el.id='timerbar';const sr=$('#sheetroot');sr.parentNode.insertBefore(el,sr)}
  const tm=S.timer;
  if(!tm.running&&tm.left===tm.total){el.className='hidden';return}
  const m=Math.floor(tm.left/60),s=tm.left%60;
  const pc=tm.total>0?tm.left/tm.total*100:0;
  const col=tm.left===0?'var(--ok)':tm.left<10?'var(--bad)':'var(--acc)';
  el.className='timerbar'+(tm.left===0?' done':'');
  el.innerHTML=`<div class="timerbar-inner"><div style="font-size:22px;font-weight:800;min-width:50px;color:${col}">${m}:${String(s).padStart(2,'0')}</div>
    <div style="flex:1;height:4px;background:var(--line);border-radius:99px"><div style="width:${pc}%;height:100%;border-radius:99px;background:${col};transition:width .9s linear"></div></div>
    <div style="display:flex;gap:6px">${tm.running?`<button data-act="timer-pause" style="font-size:16px;color:var(--mut);padding:4px 8px">\u2016</button>`:tm.left>0?`<button data-act="timer-resume" style="font-size:14px;color:var(--ok);font-weight:700;padding:4px 8px">\u25b6</button>`:''}
    <button data-act="timer-close" style="font-size:14px;color:var(--mut);padding:4px 8px">\u2715</button></div></div>`}

function allFoods(){return S.foods.concat(BASE_FOODS)}
function tplRows(q){const n=norm(q||'');const list=allMeals().filter(t=>!n||norm(t.name).includes(n)||t.items.some(i=>norm(i.name).includes(n)));
  return list.length?list.map(t=>{const tt=sumItems(t.items);return`<div class="frow" data-act="tpl-use" data-id="${t.id}">${foodIcon(t.items[0]?.name||'')}<div class="sp"><div style="font-weight:600">${esc(t.name)}</div>
    <div class="mline">${t.items.map(i=>esc(i.name)).join(' \u00B7 ')}</div><div class="mline">${macroLine(tt)}</div></div><span style="color:var(--acc);font-size:22px">+</span></div>`}).join(''):'<div class="empty">Sin resultados.</div>'}
function portionBase(portion){const m=[...String(portion||'').matchAll(/(\d+(?:[.,]\d+)?)\s*(g|ml)\b/gi)];if(!m.length)return null;const x=m[m.length-1];const a=num(x[1]);return a>0?{amt:a,unit:x[2].toLowerCase()}:null}
function gramsDefault(portion){return /^\s*\d+(?:[.,]\d+)?\s*(g|ml)\b/i.test(portion||'')}
const r2=n=>Math.round((n||0)*100)/100;
function qtyLabel(it){const b=portionBase(it.portion),q=it.qty??1;if(b&&(it.mode==='g'||(it.mode!=='p'&&gramsDefault(it.portion))))return `${fmt(q*b.amt)} ${b.unit}`;return `${r2(q)} \u00D7 ${esc(it.portion||'porci\u00F3n')}`}
function initQty(s,f,qty,mode){const b=portionBase(f.portion);s.qmode=b?(mode||(gramsDefault(f.portion)?'g':'p')):'p';s.qval=String(s.qmode==='g'?Math.round((qty??1)*b.amt):r2(qty??1))}
function qtyFrom(f,s){const v=num(s.qval);if(v==null||v<=0)return null;const b=portionBase(f.portion);return (b&&s.qmode==='g')?v/b.amt:v}
function qtyWidget(f,s){const b=portionBase(f.portion);const mode=b?s.qmode:'p';const q=qtyFrom(f,s);
  const seg=b?`<div class="seg" style="margin-top:12px"><button class="${mode==='g'?'on':''}" data-act="qmode" data-m="g">${b.unit==='ml'?'Mililitros':'Gramos'}</button><button class="${mode==='p'?'on':''}" data-act="qmode" data-m="p">Porciones</button></div>`:'';
  const inp=mode==='g'
    ?`<label class="lb">Cantidad que comiste</label><div class="row"><input id="qtyin" inputmode="decimal" value="${esc(s.qval)}" style="text-align:center;font-size:22px;font-weight:700;flex:1;min-width:0"><span style="font-weight:700;font-size:18px;flex:0 0 auto">${b.unit}</span></div>
      <div class="chips" style="margin-top:8px">${(b.unit==='ml'?[100,200,250,300,500]:[30,50,80,100,150,200,250]).map(v=>`<button class="chip" data-act="qset" data-v="${v}">${v} ${b.unit}</button>`).join('')}</div>`
    :`<label class="lb">Cantidad de porciones (${esc(f.portion||'porci\u00F3n')})</label><div class="row"><button class="btn sec2 sm" data-act="qty" data-d="-0.5">\u2212</button><input id="qtyin" inputmode="decimal" value="${esc(s.qval)}" style="text-align:center;font-size:20px;font-weight:700"><button class="btn sec2 sm" data-act="qty" data-d="0.5">+</button></div>`;
  return seg+inp+`<div class="card" style="margin-top:12px;background:var(--card2)"><div class="mline" id="qtyprev" style="font-size:14px">${macroLine(itemTot({...f,qty:q??0}))}</div></div>`}
async function searchOFF(q){
  const s=S.sheet;s.offLoading=true;s.offResults=null;
  if($('#foodlist'))$('#foodlist').innerHTML=foodPickRows();
  try{
    const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&action=process&json=1&lc=es&fields=product_name,product_name_es,product_name_es_imported,nutriments,brands&page_size=50&sort_by=unique_scans_n`;
    const r=await fetch(url);const data=await r.json();
    s.offResults=(data.products||[]).filter(p=>{
      const n=p.nutriments;if(!(p.product_name||p.product_name_es)||!n)return false;
      const kcal=n['energy-kcal_100g']||(n['energy-kj_100g']||n['energy_100g']||0)/4.184;
      return kcal>0;
    }).map(p=>{
      const n=p.nutriments;
      const kcal=Math.round(n['energy-kcal_100g']||(n['energy-kj_100g']||n['energy_100g']||0)/4.184);
      const name=(p.product_name_es||p.product_name||'').trim().replace(/\s+/g,' ');
      const brandRaw=(p.brands||'').split(',')[0].trim();
      const brand=brandRaw&&!name.toLowerCase().includes(brandRaw.toLowerCase())?` (${brandRaw})`:'';
      return{id:'off_'+uidGen(),name:(name+brand).substring(0,80),portion:'100 g',kcal,p:Math.round((n.proteins_100g||0)*10)/10,c:Math.round((n.carbohydrates_100g||0)*10)/10,f:Math.round((n.fat_100g||0)*10)/10};
    }).filter(f=>f.name&&f.kcal>0).slice(0,25);
  }catch(e){s.offResults=[];}
  s.offLoading=false;if(S.sheet===s&&$('#foodlist'))$('#foodlist').innerHTML=foodPickRows()}
function foodPickRows(){const s=S.sheet,q=(s.q||'').toLowerCase();
  if(s.offLoading)return`<div class="empty" style="padding:20px 0"><span class="spin"></span> Buscando en Open Food Facts\u2026</div>`;
  if(s.offResults!=null){
    if(!s.offResults.length)return`<div class="empty">Sin resultados en Open Food Facts.<br><br><button class="linkbtn" data-act="off-back">\u2190 Volver</button></div>`;
    return`<div class="row" style="margin:10px 0 6px"><span class="mut small">\u{1F4E6} Open Food Facts \u00B7 ${s.offResults.length} resultados</span><div class="sp"></div><button class="linkbtn" data-act="off-back">\u2190 Volver</button></div>`+s.offResults.map(f=>`<div class="frow" data-act="off-pick" data-id="${esc(f.id)}">${foodIcon(f.name)}<div class="sp"><div style="font-weight:600">${esc(f.name)}</div><div class="mline">${esc(f.portion)} \u00B7 ${fmt(f.kcal)} kcal \u00B7 <span class="p">P ${r1(f.p)}</span> <span class="c">C ${r1(f.c)}</span> <span class="f">G ${r1(f.f)}</span></div></div><span style="color:var(--acc);font-size:22px">+</span></div>`).join('');
  }
  const cnt={};Object.values(S.days).forEach(d=>MEALS.forEach(([k])=>(d.meals?.[k]||[]).forEach(it=>{if(it.foodId)cnt[it.foodId]=(cnt[it.foodId]||0)+1})));
  const usedIds=new Set(Object.keys(cnt));
  const limit=q?80:25;
  const list=allFoods().filter(f=>!q||norm(f.name).includes(norm(q))).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)||(a.base?1:0)-(b.base?1:0)||a.name.localeCompare(b.name)).slice(0,limit);
  let header='';
  if(!q)header=`<div class="mut small" style="padding:6px 0 8px">${usedIds.size>0?'\u2B50 M\u00E1s usados':'Alimentos'} \u00B7 escribe para buscar</div>`;
  let html=header+(list.length?list.map(f=>`<div class="frow" data-act="pick" data-id="${f.id}">${foodIcon(f.name)}<div class="sp"><div style="font-weight:600">${esc(f.name)}${f.base?'':' <span class="tag">M\u00CDO</span>'}</div>
    <div class="mline">${esc(f.portion)} \u00B7 ${fmt(f.kcal)} kcal \u00B7 <span class="p">P ${r1(f.p)}</span> <span class="c">C ${r1(f.c)}</span> <span class="f">G ${r1(f.f)}</span></div></div><span style="color:var(--acc);font-size:22px">+</span></div>`).join('')
    :'<div class="empty">Sin resultados en lista local.</div>');
  html+=`<div style="margin-top:12px;text-align:center"><button class="btn sec2 sm" data-act="off-search">\u{1F50D} Buscar en Open Food Facts${q?'':' (global)'}</button></div>`;
  return html}

/* ---------- actions ---------- */
function addToMeal(meal,items){const day=getDay(S.date);items.forEach(it=>day.meals[meal].push(it));save('d-'+S.date,day)}
function upsertFoods(newFoods){const items=clone(S.foods);newFoods.forEach(nf=>{const i=items.findIndex(f=>f.id===nf.id);if(i>=0)items[i]=nf;else items.push(nf)});save('foods',{items})}
function mealItemFrom(f,qty){return{foodId:f.id||null,name:f.name,portion:f.portion,kcal:f.kcal,p:f.p,c:f.c,f:f.f,qty}}
let _baseMeals=null;
function baseMeals(){if(!_baseMeals){const byName=new Map(BASE_FOODS.map(f=>[f.name,f]));
  _baseMeals=BASE_MEALS_DEF.map(m=>({id:m.id,name:m.name,base:true,items:m.items.map(([n,q])=>byName.get(n)).every(Boolean)?m.items.map(([n,q])=>mealItemFrom(byName.get(n),q)):[]})).filter(m=>m.items.length)}
  return _baseMeals}
function allMeals(){const hid=new Set(S.config.hiddenMeals||[]);return S.meals.concat(baseMeals().filter(m=>!hid.has(m.id)))}
function hideBaseMeal(id){const cfg=clone(S.config);cfg.hiddenMeals=[...new Set([...(cfg.hiddenMeals||[]),id])];return save('config',cfg)}

async function runAI(){
  const s=S.sheet,a=s.ai||(s.ai={});a.text=$('#aitext').value.trim();
  if(!a.text&&!a.img){a.err='Escrib\u00ED qu\u00E9 comiste o sub\u00ED una imagen.';renderSheet();return}
  a.busy=true;a.err=null;renderSheet();
  const prompt=`Sos un nutricionista. Identific\u00E1 cada alimento que comi\u00F3 la persona${a.img?' (en el texto y/o la imagen adjunta, que puede ser una captura del diario de MyFitnessPal o una etiqueta nutricional; si la imagen trae valores, usalos tal cual)':''} y estim\u00E1 sus macros para la cantidad consumida. Us\u00E1 valores t\u00EDpicos de Argentina.
Texto: """${a.text||'(sin texto, usar solo la imagen)'}"""
Respond\u00E9 SOLO JSON con esta forma: {"items":[{"name":"nombre corto en espa\u00F1ol","portion":"cantidad consumida, ej. 2 unidades (100 g)","kcal":0,"p":0,"c":0,"f":0}]}. p, c y f en gramos. N\u00FAmeros sin unidades.`;
  try{
    const opts={modelTier:'default'};if(a.img)opts.images=[a.img];
    const res=await S.sample.json(prompt,opts);
    const items=(res&&Array.isArray(res.items)?res.items:[]).map(x=>({name:String(x.name||'Alimento'),portion:String(x.portion||'porci\u00F3n'),kcal:num(x.kcal)||0,p:num(x.p)||0,c:num(x.c)||0,f:num(x.f)||0,sel:true}));
    if(!items.length)a.err='No pude identificar alimentos. Prob\u00E1 describi\u00E9ndolo con m\u00E1s detalle.';
    a.items=items.length?items:null;
  }catch(e){a.err=e&&e.code==='not_granted'?'La funci\u00F3n de IA no est\u00E1 habilitada en esta vista.':e&&e.code==='rate_limited'?'Demasiadas consultas seguidas, esper\u00E1 un momento.':'No se pudo analizar. Prob\u00E1 de nuevo.'}
  a.busy=false;if(S.sheet===s)renderSheet();
}

    case 'ex-del':{syncCfgDraft();S.cfgDraft.routines[+el.dataset.ri].exercises.splice(+el.dataset.ei,1);render();break}
    case 'ex-up':{syncCfgDraft();const a=S.cfgDraft.routines[+el.dataset.ri].exercises,i=+el.dataset.ei;if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]]}render();break}
    case 'save-routines':{syncCfgDraft();const cfg=clone(S.config);cfg.routines=S.cfgDraft.routines.map(r=>({id:r.id,name:r.name.trim()||'Rutina',exercises:r.exercises.map(e=>e.trim()).filter(Boolean)}));
      cfg.setsPlan={};cfg.routines.forEach((r,ri)=>r.exercises.forEach(n=>{const v=(S.cfgDraft.setsPlan||{})[n];if(v)cfg.setsPlan[n]=v}));cfg.presetApplied=true;
      save('config',cfg);S.wdraft={};S.cfgDraft=clone(cfg);S.cfgDraft.goals=clone(S.cfgDraft.goals);render();toast('Rutinas guardadas');break}
    case 'tpl-new':{const day=getDay(S.date),k=el.dataset.meal;openSheet({type:'tpl',tpl:{id:uidGen(),name:'',items:clone(day.meals[k])}});setTimeout(()=>$('#tplname')?.focus(),50);break}
    case 'tpl-edit':{const m=clone(allMeals().find(m=>m.id===el.dataset.id));if(m.base){m.baseId=m.id;m.id=uidGen();delete m.base}openSheet({type:'tpl',tpl:m});break}
    case 'tpl-rm':s.tpl.name=$('#tplname').value;s.tpl.items.splice(+el.dataset.i,1);renderSheet();break;
    case 'tpl-save':{const name=$('#tplname').value.trim();if(!name){toast('Ponele un nombre');return}if(!s.tpl.items.length){toast('No tiene alimentos');return}
      const t={...s.tpl,name},items=clone(S.meals),i=items.findIndex(m=>m.id===t.id);if(i>=0)items[i]=t;else items.push(t);
      const bid=t.baseId;delete t.baseId;items.sort((a,b)=>a.name.localeCompare(b.name));save('meals',{items});if(bid)hideBaseMeal(bid);closeSheet();render();toast('Comida guardada');break}
    case 'tpl-del':{if(!el.dataset.sure){el.dataset.sure='1';el.textContent='Toc\u00E1 de nuevo para eliminar';return}if(s.tpl.baseId)hideBaseMeal(s.tpl.baseId);else save('meals',{items:S.meals.filter(m=>m.id!==s.tpl.id)});closeSheet();render();break}
    case 'tpl-use':{const t=allMeals().find(m=>m.id===el.dataset.id);addToMeal(s.meal,clone(t.items));closeSheet();render();toast(`\u00AB${t.name}\u00BB agregada`);break}
    case 'food-new':openSheet({type:'food',food:{}});break;
    case 'food-edit':{const f=clone(allFoods().find(f=>f.id===el.dataset.id));if(f.base){delete f.id;delete f.base}openSheet({type:'food',food:f});break}
    case 'food-save':{const f=readFoodForm();if(!f.name){toast('Pon\u00E9 un nombre');return}f.id=s.food.id||uidGen();upsertFoods([f]);closeSheet();render();toast('Alimento guardado');break}
    case 'food-del':{if(!el.dataset.sure){el.dataset.sure='1';el.textContent='Toc\u00E1 de nuevo para eliminar';return}save('foods',{items:S.foods.filter(f=>f.id!==s.food.id)});closeSheet();render();break}
    case 'export-file':{const data=backupData();const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`fit-respaldo-${iso(new Date())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);break}
    case 'restore-open':openSheet({type:'restore',txt:''});break;
    case 'restore-go':{let data;try{data=JSON.parse(($('#rsttxt').value||'').trim())}catch(e){s.err='El texto no es un respaldo v\u00E1lido.';s.txt=$('#rsttxt').value;renderSheet();return}
      if(!data||typeof data!=='object'||!(data.config||data.days||data.foods||data.body||data.workouts)){s.err='No encontr\u00E9 datos de FIT en ese respaldo.';renderSheet();return}
      el.disabled=true;el.textContent='Restaurando\u2026';await restoreBackup(data);S.wdraft={};S.bodyDraft={};S.cfgDraft=null;closeSheet();render();toast('Respaldo restaurado');break}
    case 'export':{const data=backupData();
      try{await navigator.clipboard.writeText(JSON.stringify(data));toast('Respaldo copiado')}catch(e){toast('No se pudo copiar')}break}
  }
});
function syncCfgDraft(){const c=S.cfgDraft;if(!c)return;
  document.querySelectorAll('[data-rname]').forEach(i=>c.routines[+i.dataset.rname].name=i.value);
  document.querySelectorAll('[data-ename]').forEach(i=>{const[ri,ei]=i.dataset.ename.split('|').map(Number);c.routines[ri].exercises[ei]=i.value});
  c.setsPlan={...(c.setsPlan||{})};document.querySelectorAll('[data-eset]').forEach(i=>{const[ri,ei]=i.dataset.eset.split('|').map(Number);const n=c.routines[ri].exercises[ei];const v=Math.round(num(i.value)||0);if(n&&v>0)c.setsPlan[n]=v});
  document.querySelectorAll('[data-goal]').forEach(i=>{const v=num(i.value);if(v!=null)c.goals[i.dataset.goal]=v})}

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='imptxt'&&S.sheet){S.sheet.txt=t.value;return}
  if(t.dataset.body){(S.bodyDraft[S.date]||(S.bodyDraft[S.date]={}))[t.dataset.body]=t.value;return}
  if(t.dataset.rg!=null){const d=getDraft();d.exercises[+t.dataset.rg].range=t.value;d.dirty=true;return}
  if(t.dataset.w){const[ei,si,k]=t.dataset.w.split('|');const d=getDraft();d.exercises[+ei].sets[+si][k]=num(t.value);d.dirty=true;return}
  if(t.id==='tplq'){S.sheet.tq=t.value;$('#tpllist').innerHTML=tplRows(t.value);return}
  if(t.id==='foodq'){S.sheet.q=t.value;S.sheet.offResults=null;S.sheet.offLoading=false;$('#foodlist').innerHTML=foodPickRows();return}
  if(t.id==='libq'){S.libq=t.value;$('#liblist').innerHTML=libRows(libList());return}
  if(t.id==='qtyin'&&S.sheet&&(S.sheet.pick||S.sheet.item)){S.sheet.qval=t.value;const f=S.sheet.pick||S.sheet.item;$('#qtyprev').innerHTML=macroLine(itemTot({...f,qty:qtyFrom(f,S.sheet)??0}));return}
  if(t.id==='aitext'&&S.sheet?.ai){S.sheet.ai.text=t.value;return}
  if(t.dataset.aisel!=null){S.sheet.ai.items[+t.dataset.aisel].sel=t.checked;return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='stepsin'){const v=num(t.value);const day=getDay(S.date);const nv=v==null?null:Math.max(0,r0(v));if(day.steps===nv)return;day.steps=nv;save('d-'+S.date,day);t.blur();render();toast('Pasos guardados');return}
  if(t.id==='exsel'){S.progEx=t.value;render();return}
  if(t.id==='rstfile'){const f=t.files&&t.files[0];if(f)f.text().then(x=>{S.sheet.txt=x;S.sheet.err=null;renderSheet()});return}
  if(t.id==='aiimg'){const f=t.files&&t.files[0];const a=S.sheet.ai||(S.sheet.ai={});a.text=$('#aitext').value;
    if(f){if(f.size>8e6){toast('Imagen muy grande (m\u00E1x 8 MB)');return}a.img=f;a.imgName=f.name}renderSheet();return}
  if(t.dataset.aisel!=null){S.sheet.ai.items[+t.dataset.aisel].sel=t.checked}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='stepsin')ev.target.blur()});
document.addEventListener('focusout',ev=>{
  const t=ev.target;
  if(t.dataset.w){const[ei,si]=t.dataset.w.split('|');const d=getDraft();const st=d?.exercises?.[+ei]?.sets?.[+si];if(st&&st.w!=null&&st.r!=null)timerStart(S.timerDur)}
});
window.addEventListener('beforeunload',e=>{if(Object.values(S.wdraft).some(d=>d.dirty)){e.preventDefault();e.returnValue=''}});

S.themePref=themePref();applyTheme();
setInterval(()=>{const t=document.documentElement.dataset.theme;applyTheme();if(t!==document.documentElement.dataset.theme&&S.tab==='progreso')render()},300000);
init();
</script>
